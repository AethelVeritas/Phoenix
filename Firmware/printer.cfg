# ===========================================================================
# Phoenix
# ===========================================================================
 
[include fluidd.cfg]
[include quickdrawprobe.cfg]
 
# ---------------------------------------------------------------------------
# MCU
# ---------------------------------------------------------------------------
[mcu]
# Find your serial path with: ls /dev/serial/by-id/
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_CHANGEME-if00
restart_method: command
 
# ---------------------------------------------------------------------------
# PRINTER
# ---------------------------------------------------------------------------
[printer]
kinematics:             cartesian
max_velocity:           500
max_accel:              20000
max_z_velocity:         20
max_z_accel:            500
square_corner_velocity: 8.0
minimum_cruise_ratio:   0.5
 
# ---------------------------------------------------------------------------
# X AXIS
# ---------------------------------------------------------------------------
[stepper_x]
step_pin:               PF13
dir_pin:                PF12
enable_pin:             !PF14
rotation_distance:      40          # Calibrate: 20T GT2 pulley = 40mm
microsteps:             16
full_steps_per_rotation: 200
endstop_pin:            PG6
position_endstop:       0
position_min:           0
position_max:           220         # Update after measuring actual travel
homing_speed:           60
homing_retract_dist:    5
 
[stepper_x1]
step_pin:               PE2
dir_pin:                PE3
enable_pin:             !PD4
rotation_distance:      40
microsteps:             16
full_steps_per_rotation: 200
 
[tmc5160 stepper_x]
cs_pin:                 PC4
spi_software_miso_pin:  PA6
spi_software_mosi_pin:  PA7
spi_software_sclk_pin:  PA5
interpolate:            False
run_current:            2.0         # Update 
sense_resistor:         0.075       # Update to actual 
stealthchop_threshold:  0
 
[tmc5160 stepper_x1]
cs_pin:                 PD11
spi_software_miso_pin:  PA6
spi_software_mosi_pin:  PA7
spi_software_sclk_pin:  PA5
interpolate:            False
run_current:            2.0
sense_resistor:         0.075
stealthchop_threshold:  0
 
# ---------------------------------------------------------------------------
# Y AXIS 
# ---------------------------------------------------------------------------
[stepper_y]
step_pin:               PG0
dir_pin:                PG1
enable_pin:             !PF15
rotation_distance:      40
microsteps:             16
full_steps_per_rotation: 200
endstop_pin:            PG9
position_endstop:       0
position_min:           0
position_max:           220         # Update after measuring actual travel
homing_speed:           60
homing_retract_dist:    5
 
[stepper_y1]
step_pin:               PF11
dir_pin:                PG3
enable_pin:             !PG5
rotation_distance:      40
microsteps:             16
full_steps_per_rotation: 200
 
[tmc5160 stepper_y]
cs_pin:                 PD14
spi_software_miso_pin:  PA6
spi_software_mosi_pin:  PA7
spi_software_sclk_pin:  PA5
interpolate:            False
run_current:            2.0
sense_resistor:         0.075
stealthchop_threshold:  0
 
[tmc5160 stepper_y1]
cs_pin:                 PC6
spi_software_miso_pin:  PA6
spi_software_mosi_pin:  PA7
spi_software_sclk_pin:  PA5
interpolate:            False
run_current:            2.0
sense_resistor:         0.075
stealthchop_threshold:  0
 
# ---------------------------------------------------------------------------
# Z AXIS 
# ---------------------------------------------------------------------------
[stepper_z]
step_pin:               PG4
dir_pin:                PC1
enable_pin:             !PA2
rotation_distance:      40          # Adjust 
microsteps:             16
full_steps_per_rotation: 200
endstop_pin:            probe:z_virtual_endstop
position_min:           -5          # Allows Z offset calibration below 0, watch out
position_max:           250         # Update after measuring actual travel
homing_speed:           10
second_homing_speed:    3
homing_retract_dist:    5
 
[stepper_z1]
step_pin:               PF9
dir_pin:                PF10
enable_pin:             !PG2
rotation_distance:      40
microsteps:             16
full_steps_per_rotation: 200
 
[tmc2209 stepper_z]
uart_pin:               PC7
interpolate:            False
run_current:            0.8
stealthchop_threshold:  0
 
[tmc2209 stepper_z1]
uart_pin:               PF2
interpolate:            False
run_current:            0.8
stealthchop_threshold:  0
 
# ---------------------------------------------------------------------------
# EXTRUDER 
# ---------------------------------------------------------------------------
[extruder]
step_pin:               PC13
dir_pin:                PF0
enable_pin:             !PF1
rotation_distance:      4.637       # Calibrate with e-step test after setup
microsteps:             16
full_steps_per_rotation: 200
nozzle_diameter:        0.400
filament_diameter:      1.750
heater_pin:             PA3
sensor_type:            PT1000
sensor_pin:             PF4
pullup_resistor:        4700        # Required for PT1000 on most boards, doublecheck
min_temp:               0
max_temp:               350
min_extrude_temp:       170
max_extrude_only_distance: 500
max_extrude_only_velocity: 60
max_extrude_only_accel: 1500
max_extrude_cross_section: 5
pressure_advance:       0.035       # Tune with PA test after setup
pressure_advance_smooth_time: 0.040
# Run PID_CALIBRATE HEATER=extruder TARGET=250 and paste results here below 
control:                pid
pid_kp:                 28.0
pid_ki:                 2.0
pid_kd:                 90.0
 
[tmc2209 extruder]
uart_pin:               PE4
interpolate:            False
run_current:            0.65
stealthchop_threshold:  0
 
# ---------------------------------------------------------------------------
# HEATED BED
# ---------------------------------------------------------------------------
[heater_bed]
heater_pin:             PA1
sensor_type:            Generic 3950
sensor_pin:             PF3
min_temp:               0
max_temp:               130

# Run PID_CALIBRATE HEATER=heater_bed TARGET=60 and paste results below
control:                pid
pid_kp:                 60.0
pid_ki:                 2.5
pid_kd:                 400.0
 
# ---------------------------------------------------------------------------
# FANS
# ---------------------------------------------------------------------------
[fan]
pin:                    PA8
 
[heater_fan hotend_fan]
pin:                    PE5
heater:                 extruder:
heater_temp:            50.0
fan_speed:              1.0
 
[controller_fan controller_fan]
pin:                    PD12
stepper:                stepper_x
 
# ---------------------------------------------------------------------------
# BED MESH
# ---------------------------------------------------------------------------
[bed_mesh]
speed:                  150
horizontal_move_z:      10
mesh_min:               20, 20
mesh_max:               200, 200
probe_count:            5, 5
mesh_pps:               2, 2
algorithm:              bicubic
bicubic_tension:        0.2
fade_start:             0.6
fade_end:               10.0
 
# ---------------------------------------------------------------------------
# Z TILT
# Adjust z_positions to match where each Z motor drives the gantry
# ---------------------------------------------------------------------------
[z_tilt]
z_positions:
    -50, 110
    270, 110
points:
    30, 110
    190, 110
speed:                  150
horizontal_move_z:      10
retries:                5
retry_tolerance:        0.0075
 
# ---------------------------------------------------------------------------
# INPUT SHAPER
# Fill in after running resonance tests
# ---------------------------------------------------------------------------
[input_shaper]
shaper_type_x:          mzv
shaper_freq_x:          0
shaper_type_y:          mzv
shaper_freq_y:          0
 
[resonance_tester]
accel_chip:             adxl345
probe_points:           110, 110, 20
 
# ADXL345 — comment out if not connected yet
[adxl345]
cs_pin:                 PB12
spi_software_sclk_pin:  PB10
spi_software_mosi_pin:  PB11
spi_software_miso_pin:  PB2
axes_map:               x, y, z
 
# ---------------------------------------------------------------------------
# PRINT START / END
# ---------------------------------------------------------------------------
[gcode_macro PRINT_START]
gcode:
    {% set BED_TEMP = params.BED|default(60)|float %}
    {% set HOTEND_TEMP = params.HOTEND|default(200)|float %}
    M140 S{BED_TEMP}                  # Start bed heating
    M109 S150                         # Preheat hotend to safe temp (no ooze)
    M190 S{BED_TEMP}                  # Wait for bed
    G28                               # Home all
    Z_TILT_ADJUST                     # Level gantry
    BED_MESH_CALIBRATE                # Auto mesh
    G28 Z                             # Re-home Z after mesh
    M109 S{HOTEND_TEMP}               # Heat to print temp
    G92 E0
    G1 Z5 F3000
    G1 X5 Y5 F5000
    G1 Z0.3 F300
    G1 X100 E15 F600                  # Purge line
    G92 E0
 
[gcode_macro PRINT_END]
gcode:
    M400
    G92 E0
    G1 E-4 F3600                      # Retract
    G91
    G1 Z10 F3000
    G90
    G1 X0 Y{printer.toolhead.axis_maximum.y} F5000
    M106 S0
    M104 S0
    M140 S0
    M84
 
# ---------------------------------------------------------------------------
# MISC
# ---------------------------------------------------------------------------
[idle_timeout]
timeout:                1800
 
[pause_resume]
 
[display_status]
 
[virtual_sdcard]
path: /home/pi/printer_data/gcodes
 
[exclude_object]
 
[gcode_arcs]
resolution: 0.1
 
